services:
  afrokernel-dev:
    image: node:22-alpine
    container_name: afrokernel-dev
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
      - /app/.tanstack
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://znhuzzkqrrtzviamsvby.supabase.co}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_1sdqLpDe9XzEqVw1DSHbcA_0mXlm6aR}
      - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID:-znhuzzkqrrtzviamsvby}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
