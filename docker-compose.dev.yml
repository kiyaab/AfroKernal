services:
  postgres:
    image: postgres:16-alpine
    container_name: afrokernel-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-afrokernel}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afrokernel"]
      interval: 10s
      timeout: 5s
      retries: 5

  afrokernel-dev:
    image: node:22-alpine
    container_name: afrokernel-dev
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
      - /app/.tanstack
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/afrokernel?schema=public}
    command: sh -c "npx prisma generate && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  postgres_data_dev:
